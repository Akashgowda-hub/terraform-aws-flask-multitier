<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Task Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen py-10 px-4">
    <div class="max-w-xl mx-auto bg-white shadow-lg rounded-xl p-6 border border-slate-100">
        <h1 class="text-2xl font-bold text-center text-slate-900 mb-2">DevOps Task Manager</h1>
        <div class="text-xs text-center bg-indigo-50 text-indigo-700 py-1.5 px-3 rounded-lg font-medium mb-6">
            Architecture: {{ architecture }} &bull; DB Host: {{ db_host }}
        </div>

        <form action="/add" method="POST" class="flex gap-2 mb-6">
            <input type="text" name="task" placeholder="Enter a new task..." required
                class="flex-1 px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
            <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-5 py-2 rounded-lg text-sm transition">
                Add Task
            </button>
        </form>

        <h2 class="text-lg font-semibold text-slate-700 mb-3 flex justify-between items-center">
            <span>Tasks Queue</span>
            <span class="text-xs bg-slate-200 text-slate-700 px-2.5 py-1 rounded-full font-bold">{{ tasks | length }} Total</span>
        </h2>

        <ul class="space-y-3">
            {% for task in tasks %}
                <li class="flex items-center justify-between bg-slate-50 border border-slate-200 p-3.5 rounded-lg shadow-sm">
                    <span class="text-sm font-medium text-slate-700">#{{ task.id }} - {{ task.task }}</span>
                    <div class="flex items-center gap-2">
                        <a href="/update/{{ task.id }}" class="bg-amber-500 hover:bg-amber-600 text-white text-xs font-medium px-3 py-1.5 rounded-md transition">Edit</a>
                        <form action="/delete/{{ task.id }}" method="POST" style="margin:0;">
                            <button type="submit" class="bg-rose-500 hover:bg-rose-600 text-white text-xs font-medium px-3 py-1.5 rounded-md transition">Delete</button>
                        </form>
                    </div>
                </li>
            {% else %}
                <li class="text-center py-8 text-slate-400 text-sm italic">No tasks found in database.</li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
